<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Moodboard Clipper cover</title>
<!-- 1280×640: the repo's social preview and the site's og:image. brand/tools/cover.mjs renders it to brand/cover.jpg.
     The four pictures are the first four in demo/works/works.json. The saved picture, with the button's ✓ in its
     lower left corner where the extension puts it, leads the first column so that the corner stays inside the cover. -->
<style>
  @font-face { font-family: Onest; src: url(../site/assets/fonts/onest-variable.woff2) format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { display: grid; grid-template-columns: 600px 1fr; grid-template-rows: 640px; background: #6A50EF; color: #FFFFFF; font-family: Onest, sans-serif; }
  .text { padding: 72px 0 64px 80px; display: flex; flex-direction: column; }
  .icon { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 0 0 4px rgba(255, 255, 255, .9), 0 16px 40px rgba(20, 10, 60, .35); }
  h1 { margin: 40px 0 0; font-size: 72px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 20px 0 0; font-size: 26px; line-height: 1.3; font-weight: 400; max-width: 470px; opacity: .92; text-wrap: balance; }
  .by { margin-top: auto; display: flex; align-items: center; gap: 12px; font-size: 20px; opacity: .9; }
  .wordmark { width: 168px; height: 25px; background: #FFFFFF;
    -webkit-mask: url(wordmark.svg) left center / contain no-repeat; mask: url(wordmark.svg) left center / contain no-repeat; }
  .board { position: relative; overflow: hidden; padding: 48px 56px 0 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { display: grid; gap: 20px; }
  .col:last-child { margin-top: 72px; }
  .board img { display: block; width: 100%; border-radius: 18px; box-shadow: 0 18px 40px rgba(20, 10, 60, .35); }
  .card { position: relative; }
  .saved { position: absolute; left: 14px; bottom: 14px; width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #6A50EF;
    display: grid; place-items: center; font: 700 26px/1 Onest, sans-serif; box-shadow: 0 6px 16px rgba(20, 10, 60, .3); }
</style>
<div class="text">
  <img class="icon" src="icon.svg" alt="">
  <h1>Moodboard Clipper</h1>
  <p>Saves pictures from Pinterest, Cosmos and any page into a folder on your computer.</p>
  <div class="by">by <span class="wordmark" role="img" aria-label="SPELLLENS"></span></div>
</div>
<div class="board">
  <div class="col">
    <div class="card"><img src="../demo/works/02.jpg" alt=""><span class="saved">✓</span></div>
    <div class="card"><img src="../demo/works/01.jpg" alt=""></div>
  </div>
  <div class="col">
    <div class="card"><img src="../demo/works/03.jpg" alt=""></div>
    <div class="card"><img src="../demo/works/04.jpg" alt=""></div>
  </div>
</div>
</html>
