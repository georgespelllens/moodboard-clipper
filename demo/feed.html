<!doctype html>
<html lang="{{lang}}">
<meta charset="utf-8">
<title>Demo feed</title>
<!-- Shaped like a Pinterest feed for the extension (data-test-id="pin", /pin/<id>/ links, i.pinimg.com images),
     drawn in SPELLLENS colours so it does not pass for the real site. demo/serve.mjs puts in the cards and the
     texts of the chosen language (page language, search pill, tag). -->
<style>
  :root { color-scheme: light; --bg: #F4F3F7; --card: #FFFFFF; --ink: #17161C; --muted: #6E6B7B; --line: #E4E2EC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 32px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #A99EFC, #6A50EF); }
  .search { flex: 1; max-width: 520px; height: 40px; border-radius: 20px; background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 16px; color: var(--muted); }
  .tag { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 24px 32px; }
  .grid { columns: 236px; column-gap: 16px; max-width: 1400px; margin: 0 auto; }
  .item { break-inside: avoid; margin: 0 0 20px; }
  [data-test-id="pin"] { position: relative; }
  [data-test-id="pin"] a { display: block; border-radius: 16px; overflow: hidden; background: var(--line); }
  img { display: block; width: 100%; height: auto; }
  .item p { margin: 8px 4px 0; font-weight: 600; font-size: 13px; }
</style>
<header>
  <div class="mark"></div>
  <div class="search">{{search}}</div>
  <div class="tag">{{tag}}</div>
</header>
<main><div class="grid" role="list">
{{cards}}
</div></main>
</html>
