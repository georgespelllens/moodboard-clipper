<!doctype html>
<html lang="{{lang}}">
<meta charset="utf-8">
<title>{{board}}</title>
<!-- A folder window drawn after the macOS Finder: the files in it are the ones the extension has just saved. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F4F3F7;
    font: 13px/1.3 -apple-system, system-ui, sans-serif; color: #1D1D1F; }
  .window { width: 860px; border-radius: 12px; overflow: hidden; background: #FFFFFF;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, .25), 0 24px 64px rgba(23, 22, 28, .22); }
  .bar { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 16px; background: #F6F6F6; border-bottom: 1px solid #E2E2E2; }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; }
  .lights i:nth-child(2) { background: #FEBC2E; }
  .lights i:nth-child(3) { background: #28C840; }
  .title { font-weight: 700; font-size: 14px; }
  .path { margin-left: auto; color: #6E6E73; font-size: 12px; }
  .files { display: flex; flex-wrap: wrap; gap: 28px 20px; padding: 28px 32px 36px; min-height: 300px; align-content: flex-start; }
  figure { margin: 0; width: 176px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figure img { max-width: 128px; max-height: 128px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, .18); }
  .doc { width: 96px; height: 120px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D2D2D7; position: relative;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12); display: grid; place-items: end center; padding-bottom: 14px; }
  .doc::before { content: ""; position: absolute; top: -1px; right: -1px; width: 26px; height: 26px; background: #EDEDF0;
    border-bottom-left-radius: 6px; border-left: 1px solid #D2D2D7; border-bottom: 1px solid #D2D2D7; }
  .doc span { font-weight: 700; font-size: 12px; color: #6A50EF; letter-spacing: .04em; }
  figcaption { text-align: center; font-size: 12px; overflow-wrap: anywhere; max-width: 176px; }
  .status { padding: 8px 16px; border-top: 1px solid #E2E2E2; color: #6E6E73; font-size: 11px; text-align: center; background: #FAFAFA; }
</style>
<div class="window">
  <div class="bar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="title">{{board}}</div>
    <div class="path">{{downloads}} › moodboard-inbox › {{board}}</div>
  </div>
  <div class="files">{{tiles}}</div>
  <div class="status">{{count}}</div>
</div>
</html>
